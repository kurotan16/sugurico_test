<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>トップページ | スグリコ</title>
    <style>
        .tag-badge {
            display: inline-flex;
            align-items: center;
            background-color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.9em;
        }
        .tag-remove-btn {
            margin-left: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #888;
        }
        .tag-remove-btn:hover {
            color: #000;
        }
    </style>
</head>
<body>
    <h1>スグリコへようこそ！</h1>

    <p>こんにちは、<span sec:authentication="name"></span> さん</p>

    <!-- ログアウトフォーム -->
    <form th:action="@{/logout}" method="post" style="display: inline;">
        <button type="submit">ログアウト</button>
    </form>

    <a th:href="@{/profile}" style="margin-left: 10px;">プロフィール編集</a>
    <a th:href="@{/timeline}" style="margin-left: 10px;">みんなのログを見る</a>
    <hr>

    <h2>新しいログを記録する</h2>
    <form th:action="@{/logs}" th:object="${newLog}" method="post" enctype="multipart/form-data">
        <div style="margin-bottom: 10px;">
            <label for="title">タイトル:</label><br>
            <input type="text" th:field="*{title}" id="title" size="50" placeholder="今日のハイライトは？">
        </div>
        <div>
            <label for="content">本文:</label><br>
            <textarea th:field="*{content}" id="content" rows="4" cols="50" placeholder="今日の出来事を記録しよう" required></textarea>
        </div>
        <div style="margin-top: 10px;">
            <input type="checkbox" th:field="*{public}" id="isPublic">
            <label for="isPublic">このログを公開して他のユーザーにも見えるようにする</label>
        </div>
        <div style="margin-top: 10px;">
            <label>タグ (Enterで追加 / 5個まで):</label>
            <!-- タグのバッジが表示されるエリア -->
            <div id="tag-container" style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; margin-bottom: 5px; min-height: 28px; padding: 5px; border: 1px solid #ccc; border-radius: 4px;">
                <!-- ここにJavaScriptでタグが追加される -->
            </div>
            <!-- 実際の入力欄 -->
            <input type="text" id="tag-input-field" size="50" placeholder="タグを入力してEnter" style="border: none; outline: none; width: 100%;">
            <!-- サーバーに送信するための隠しフィールド -->
            <input type="hidden" name="tagInput" id="tag-input-hidden">
        </div>
        <div style="margin-top: 10px;">
            <label for="imageFiles">画像ファイル (複数選択可):</label><br> 
            <input type="file" name="imageFiles" id="imageFiles" accept="image/*" multiple>
        </div>
        <button type="submit">記録する</button>
    </form>

    <hr>

    <div style="display: flex; align-items: center; gap: 20px;">
        <h2>あなたの最新ログ (3件)</h2>
        <a th:href="@{/logs/archive}">すべてのあなたのログを見る</a>
    </div>
    <div th:if="${#lists.isEmpty(myLogs)}">
        <p>まだ記録がありません。</p>
    </div>
    <div th:unless="${#lists.isEmpty(myLogs)}">
        <ul th:each="log : ${myLogs}">
            <li>
                <a th:href="@{/logs/{id}(id=${log.id})}">
                    <strong th:text="${#temporals.format(log.createdAt, 'yyyy/MM/dd HH:mm')}"></strong> - 
                    <strong th:text="${log.title}">タイトル</strong>
                </a>
                <a th:href="@{/logs/{id}/edit(id=${log.id})}" style="margin-left: 10px;">編集</a>
        
                <form th:action="@{/logs/{id}/delete(id=${log.id})}" method="post" style="display: inline; margin-left: 5px;">
                    <button type="submit" onclick="return confirm('本当にこのログを削除しますか？');">削除</button>
                </form>
                
                <br>
                <!-- log.images に画像があればループして表示 -->
                <div th:if="${not #lists.isEmpty(log.images)}" style="padding-left: 15px; margin-top: 5px;">
                    <!-- 画像を横に並べるためのコンテナ -->
                    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <div th:each="image : ${log.images}">
                            <img th:src="${image.imageUrl}" alt="ログの画像" style="max-width: 150px; max-height: 150px; object-fit: cover;">
                        </div>
                    </div>
                </div>
                <span th:text="${log.content}" style="padding-left: 15px;">本文</span>
            </li>
        </ul>
    </div>

     <hr style="margin: 30px 0;">

    <!-- みんなの最新ログ -->
    <div style="display: flex; align-items: center; gap: 20px;">
        <h2>みんなの最新ログ</h2>
        <a th:href="@{/timeline}">タイムラインをもっと見る</a>
    </div>
    <div th:if="${#lists.isEmpty(publicLogs)}">
        <p>まだ公開されたログはありません。</p>
    </div>
    <div th:unless="${#lists.isEmpty(publicLogs)}">
        <ul th:each="log : ${publicLogs}">
             <!-- ログ表示のブロック (内容は同じだが、編集・削除ボタンがない) -->
            <li style="border-bottom: 1px solid #eee; padding-bottom: 15px; margin-bottom: 15px;">
                <!-- 投稿者と日時の情報 -->
                <div>
                    <strong>投稿者: <span th:text="${log.user.username}"></span></strong>
                    <small th:text="${#temporals.format(log.createdAt, 'yyyy/MM/dd HH:mm')}" style="color: #888; margin-left:10px;"></small>
                </div>
                
                <a th:href="@{/logs/{id}(id=${log.id})}" style="text-decoration: none; color: inherit;">
                    <h3 th:text="${log.title}" style="margin: 10px 0 5px 0;"></h3>
                    <p th:text="${#strings.abbreviate(log.content, 100)}" style="margin: 0 0 10px 0;"></p>
                </a>

                <!-- 画像一覧 -->
                <div th:if="${not #lists.isEmpty(log.images)}" style="padding-left: 15px; margin-top: 5px;">
                    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <div th:each="image : ${log.images}">
                            <img th:src="${image.imageUrl}" alt="ログの画像" style="max-width: 150px; max-height: 150px; object-fit: cover;">
                        </div>
                    </div>
                </div>

                <!-- タグ表示エリア -->
                <div th:if="${not #sets.isEmpty(log.tags)}" style="margin-top: 10px; padding-left: 15px;">
                    <a th:each="tag : ${log.tags}" th:href="@{/logs/archive(keyword=${tag.name})}"
                       style="margin-right: 5px; background-color: #f0f0f0; padding: 1px 6px; border-radius: 3px; font-size: 0.9em; text-decoration: none; color: inherit;">
                        <span th:text="${tag.name}"></span>
                    </a>
                </div>
            </li>
        </ul>
    </div>

    <script>
        const tagContainer = document.getElementById('tag-container');
        const tagInputField = document.getElementById('tag-input-field');
        const tagInputHidden = document.getElementById('tag-input-hidden');
        
        // 現在のタグを管理するためのSet (重複を防ぐ)
        const currentTags = new Set();

        // テキスト入力欄でキーが押された時のイベント
        tagInputField.addEventListener('keydown', function(event) {
            // Enterキーが押されたら
            if (event.key === 'Enter') {
                // 本来のEnterキーの動作（フォーム送信など）をキャンセル
                event.preventDefault();
                
                const tagName = tagInputField.value.trim();

                // 入力が空でない、上限に達していない、かつ重複していない場合のみ追加
                if (tagName && currentTags.size < 5 && !currentTags.has(tagName)) {
                    addTag(tagName);
                    tagInputField.value = ''; // 入力欄をクリア
                }
            }
        });
        
        // タグを追加する関数
        function addTag(name) {
            currentTags.add(name); // Setに追加
            
            // タグバッジのHTML要素を作成
            const tagBadge = document.createElement('div');
            tagBadge.classList.add('tag-badge');
            tagBadge.innerHTML = `
                <span>${name}</span>
                <span class="tag-remove-btn" data-name="${name}">×</span>
            `;
            
            // 削除ボタンのイベントリスナーを設定
            tagBadge.querySelector('.tag-remove-btn').addEventListener('click', function() {
                removeTag(name);
            });

            // 画面に表示
            tagContainer.appendChild(tagBadge);
            
            // 隠しフィールドの値を更新
            updateHiddenInput();
        }

        // タグを削除する関数
        function removeTag(name) {
            currentTags.delete(name); // Setから削除

            // 画面から対応するバッジを削除
            const badgeToRemove = tagContainer.querySelector(`.tag-remove-btn[data-name="${name}"]`).parentElement;
            tagContainer.removeChild(badgeToRemove);
            
            // 隠しフィールドの値を更新
            updateHiddenInput();
        }

        // 隠しフィールドの値を更新する関数
        function updateHiddenInput() {
            // Setの内容をカンマ区切りの文字列に変換してセット
            tagInputHidden.value = Array.from(currentTags).join(',');
        }
    </script>

</body>
</html>
