<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>過去のログ一覧 | スグリコ</title>
</head>
<body>
    <h1>過去のログ一覧</h1>

    <!-- ★★★ 検索フォーム ★★★ -->
    <div style="margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 5px;">
        <form th:action="@{/logs/archive}" method="get">
            <!-- キーワード入力 -->
            <div>
                <input type="text" name="keyword" size="40" th:value="${keyword}" placeholder="キーワードを入力...">
            </div>
            
            <!-- 検索タイプ選択 -->
            <div style="margin-top: 10px;">
                <strong>検索対象:</strong>
                <input type="radio" id="search-all" name="searchType" value="all" th:checked="${searchType == 'all' or searchType == null}">
                <label for="search-all">すべて</label>
                
                <input type="radio" id="search-text" name="searchType" value="text" th:checked="${searchType == 'text'}">
                <label for="search-text">本文とタイトル</label>
                
                <input type="radio" id="search-tag" name="searchType" value="tag" th:checked="${searchType == 'tag'}">
                <label for="search-tag">タグのみ</label>
            </div>

            <!-- ボタン -->
            <div style="margin-top: 15px;">
                <button type="submit">検索</button>
                <a th:href="@{/logs/archive}" style="margin-left: 10px;">リセット</a>
            </div>
        </form>
    </div>

    <!-- ★★★ 検索結果表示 ★★★ -->
    <div th:if="${#lists.isEmpty(logs)}">
        <p th:if="${keyword != null}">
            「<span th:text="${keyword}"></span>」に一致するログは見つかりませんでした。
        </p>
        <p th:unless="${keyword != null}">
            まだ記録がありません。
        </p>
    </div>

    <div th:unless="${#lists.isEmpty(logs)}">
        <!-- ログ一覧の表示ロジックは index.html と同じ -->
        <ul th:each="log : ${logs}">
            <li>
                <a th:href="@{/logs/{id}(id=${log.id})}">
                    <strong th:text="${#temporals.format(log.createdAt, 'yyyy/MM/dd HH:mm')}"></strong> -
                    <strong th:text="${log.title}">タイトル</strong>
                </a>
                <a th:href="@{/logs/{id}/edit(id=${log.id})}" style="margin-left: 10px;">編集</a>

                <form th:action="@{/logs/{id}/delete(id=${log.id})}" method="post" style="display: inline; margin-left: 5px;">
                    <button type="submit" onclick="return confirm('本当にこのログを削除しますか？');">削除</button>
                </form>

                <br>
                <!-- 画像一覧表示 -->
                <div th:if="${not #lists.isEmpty(log.images)}" style="padding-left: 15px; margin-top: 5px;">
                    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                        <div th:each="image : ${log.images}">
                            <img th:src="${image.imageUrl}" alt="ログの画像" style="max-width: 150px; max-height: 150px; object-fit: cover;">
                        </div>
                    </div>
                </div>
                <!-- 本文表示 -->
                <span th:text="${log.content}" style="padding-left: 15px; display: block; margin-top: 5px;">本文</span>

                <!-- タグ表示エリア -->
                <div th:if="${not #sets.isEmpty(log.tags)}" style="margin-top: 10px; padding-left: 15px;">
                    <a th:each="tag : ${log.tags}" th:href="@{/logs/archive(keyword=${tag.name})}"
                    style="margin-right: 5px; background-color: #f0f0f0; padding: 1px 6px; border-radius: 3px; font-size: 0.9em; text-decoration: none; color: inherit;">
                        <span th:text="${tag.name}"></span>
                    </a>
                </div>
            </li>
        </ul>
    </div>
    
    <hr>
    <a th:href="@{/}">トップページに戻る</a>

</body>
</html>
